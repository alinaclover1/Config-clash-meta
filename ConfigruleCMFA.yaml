port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: false
mode: rule
log-level: silent
allow-lan: true
external-controller: 0.0.0.0:9090
secret: ""
bind-address: "*"
unified-delay: true
profile:
  store-selected: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  listen: 0.0.0.0:7874
  nameserver:
    - 8.8.8.8
    - 1.0.0.1
    - https://dns.google/dns-query
  fallback:
    - 1.1.1.1
    - 8.8.4.4
    - https://cloudflare-dns.com/dns-query
    - 112.215.203.254
  default-nameserver:
    - 8.8.8.8
    - 1.1.1.1
    - 112.215.203.254
proxies:
  - name: SZ STORE
    server: 13.249.231.85
    port: 443
    type: vless
    uuid: fd9fce09-d422-4fe5-aa94-e77515987b4c
    alterId: 0
    cipher: auto
    tls: false
    skip-cert-verify: true
    servername: d3g3sngx74a42t.cloudfront.net
    network: ws
    ws-opts:
      path: /vless
      headers:
        Host: d3g3sngx74a42t.cloudfront.net
    udp: true
  - name: NADIA STORE1
    server: 13.249.231.85
    port: 443
    type: vmess
    uuid: 4b292ed3-ef3a-4c89-a5c1-bf95a82bb0c1
    cipher: auto
    tls: true
    skip-cert-verify: true
    servername: d3vaf207v45s96.cloudfront.net
    network: ws
    ws-opts:
      path: /vmess
      headers:
        Host: d3vaf207v45s96.cloudfront.net
    udp: true
  - name: NADIA STORE2
    server: 54.192.164.129
    port: 443
    type: vmess
    uuid: e45ca595-ec9b-4d79-9251-60eb5529eb95
    cipher: auto
    tls: true
    skip-cert-verify: true
    servername: d1nb959atmxqi3.cloudfront.net
    network: ws
    ws-opts:
      path: /vmess
      headers:
        Host: d1nb959atmxqi3.cloudfront.net
    udp: true

proxy-groups:
  - name: ID-X
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - SZ STORE
      - NADIA STORE1
      - NADIA STORE2

  - name: MIX-X
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - SZ STORE
      - NADIA STORE1
      - NADIA STORE2
      
  - name: IKLAN
    type: select
    proxies:
     - MIX-X
     - REJECT

  - name: GAME
    type: select
    proxies:
     - ID-X
     - DIRECT
     - REJECT

rules:
 - IP-CIDR,198.18.0.1/16,REJECT,no-resolve
 - RULE-SET,Block,IKLAN
 - RULE-SET,Game,GAME
 - RULE-SET,Umum,MIX-X
 - RULE-SET,indo,ID-X
 - RULE-SET,Sosmed,MIX-X
 - RULE-SET,Streaming,MIX-X
 - RULE-SET,Bankid,ID-X
 - RULE-SET,Tiktok,MIX-X
 - RULE-SET,Meta,MIX-X
 - RULE-SET,PortGame,GAME
 - MATCH,MIX-X


rule-providers:
  Game:
    type: file
    behavior: classical
    path: ./game.yaml 
  PortGame:
    type: file
    behavior: classical
    path: ./portgame.yaml
  Umum:
    type: file
    behavior: classical
    path: ./umum.yaml 
  indo:
    type: file
    behavior: classical
    path: ./indo.yaml
  Sosmed:
    type: file
    behavior: classical
    path: ./sosmed.yaml
  Streaming:
    type: file
    behavior: classical
    path: ./streaming.yaml
  Bankid:
    type: file
    behavior: domain
    path: ./bankid.yaml
  Tiktok:
    type: file
    behavior: domain
    path: ./tiktok.yaml
  Meta:
    type: file
    behavior: domain
    path: ./meta.yaml
  Block:
    type: file
    behavior: domain
    path: ./block.yaml  
